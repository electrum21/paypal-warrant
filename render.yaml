services:
  - type: web
    name: warrant
    runtime: node
    buildCommand: npm ci && npm run build:web
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24.0.0"
      - key: DATABASE_PATH
        value: /var/data/warrant.db
      - key: PORT
        value: "10000"
      - key: APP_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: JUDGE_TOKEN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CHANNEL3_URL
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false
      - key: EVIDENCE_WEBHOOK_SECRET
        sync: false
      - key: STUDIO_LLM_API_KEY
        sync: false
      - key: STUDIO_LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_MCP_ENABLED
        value: "true"
    disk:
      name: warrant-data
      mountPath: /var/data
      sizeGB: 1
